name: Deploy Readiness

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  one-click-deploy:
    name: One-click deploy gate
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
      DB_SYNC: "false"
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: ecommerce_dev
      DB_USER: root
      DB_PASS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify one-click deploy readiness
        run: pnpm deploy:verify
