  <head>
    <meta charset="UTF-8" />

    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <script>
      (function () {
        try {
          var key = "tp_storefront_theme";
          var allowed = { light: true, dark: true, system: true };
          var stored = localStorage.getItem(key) || "system";
          if (!allowed[stored]) stored = "system";
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = stored === "dark" || (stored === "system" && prefersDark)
            ? "dark"
            : "light";
          document.documentElement.classList.toggle("dark", resolved === "dark");
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themePreference = stored;
          document.documentElement.style.colorScheme = resolved;
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) {
            themeMeta.setAttribute("content", resolved === "dark" ? "#020617" : "#f8fafc");
          }
        } catch (error) {}
      })();
    </script>
