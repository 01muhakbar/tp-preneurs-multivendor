services:
  - type: web
    name: tp-preneurs-multivendor
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: pnpm deploy:start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    preDeployCommand: pnpm deploy:pre
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_DIST_DIR
        value: client/dist
      - key: DB_SYNC
        value: "false"
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: AUTH_COOKIE_NAME
        value: tp_auth
      - key: COOKIE_SECURE
        value: "true"
      - key: UPLOAD_DIR
        value: uploads
      - key: RATE_LIMIT_DISABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
